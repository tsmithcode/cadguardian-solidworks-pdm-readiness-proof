<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">CAD Guardian SolidWorks and PDM Readiness Quick-Start Kit social preview</title>
  <desc id="desc">Branded public proof preview with repo title, service lane, proof decision, and run command.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.58" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 122 C210 36 384 34 548 112 C735 201 903 174 1280 58 L1280 0 L0 0 Z" fill="#2dd4bf" opacity="0.12"/>
  <path d="M0 640 L0 512 C226 446 392 474 566 540 C742 607 944 612 1280 490 L1280 640 Z" fill="#d946ef" opacity="0.12"/>
  <rect x="64" y="64" width="1152" height="512" rx="28" fill="#0b1220" opacity="0.84" stroke="#ffffff" stroke-opacity="0.16"/>

  <g transform="translate(96 92)">
    <rect x="0" y="0" width="116" height="116" rx="18" fill="#05070b" stroke="#d946ef" stroke-opacity="0.62"/>
    <path d="M30 82 L58 24 L88 82 Z" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M44 62 H76" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>
    <text x="146" y="36" fill="#2dd4bf" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="4">CAD GUARDIAN</text>
    <text x="146" y="78" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">SolidWorks/PDM Readiness</text>
  </g>

  <g transform="translate(96 238)">
    <text x="0" y="0" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900">SolidWorks and PDM</text>
    <text x="0" y="70" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900">Readiness Quick-Start Kit</text>
    <rect x="0" y="112" width="948" height="5" fill="url(#accent)" filter="url(#softGlow)"/>
  </g>

  <g transform="translate(96 402)">
    <rect x="0" y="0" width="512" height="96" rx="16" fill="#05070b" stroke="#2dd4bf" stroke-opacity="0.36"/>
    <text x="28" y="34" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">PROOF DECISION</text>
    <text x="28" y="66" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Ready for private sample, cleanup,</text>
    <text x="28" y="92" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">PDM check, or API adapter?</text>

    <rect x="544" y="0" width="560" height="96" rx="16" fill="#05070b" stroke="#fbbf24" stroke-opacity="0.36"/>
    <text x="572" y="34" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">RUN COMMAND</text>
    <text x="572" y="69" fill="#fde68a" font-family="SFMono-Regular, Consolas, monospace" font-size="24" font-weight="700">npm run demo</text>
  </g>

  <text x="96" y="548" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Service lane: cadguardian.com/services/solidworks-pdm-readiness</text>
</svg>
